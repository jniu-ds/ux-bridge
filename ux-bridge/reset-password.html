<!DOCTYPE html>
<html lang="en" style="visibility: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | UX Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-card">
        <div class="auth-card__intro">
          <a class="brand-mark brand-mark--solo" href="./index.html" aria-label="UX Bridge login">
            <span class="brand-mark__icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M16 4C9.372 4 4 9.372 4 16c0 6.627 5.372 12 12 12 6.627 0 12-5.373 12-12C28 9.372 22.627 4 16 4Z" />
                <path d="M10.4 16c1.6-4.4 4.1-6.6 5.6-6.6s4 2.2 5.6 6.6c-1.6 4.4-4.1 6.6-5.6 6.6s-4-2.2-5.6-6.6Z" />
                <path d="M7.5 12.3c3.8.2 6.8 1.4 8.5 3.7-1.7 2.3-4.7 3.5-8.5 3.7" />
                <path d="M24.5 12.3c-3.8.2-6.8 1.4-8.5 3.7 1.7 2.3 4.7 3.5 8.5 3.7" />
              </svg>
            </span>
          </a>
          <p class="auth-card__eyebrow">Protected Access</p>
          <h1>Reset your password</h1>
          <p class="auth-card__copy">
            Choose a new password for your UX Bridge account. This reset link is time-limited for your security.
          </p>
        </div>

        <form class="auth-form" data-reset-form>
          <label class="auth-field">
            <span>New Password</span>
            <input type="password" name="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label class="auth-field">
            <span>Confirm Password</span>
            <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required />
          </label>
          <p class="auth-hint">
            Use at least 8 characters with an uppercase letter, lowercase letter, number, and special character.
          </p>
          <p class="auth-status" data-reset-status aria-live="polite"></p>
          <button class="auth-submit" type="submit">Set New Password</button>
          <a class="auth-secondary auth-secondary--link" href="./index.html">Back to Sign In</a>
        </form>
      </section>
    </main>

    <script src="./reset-password.js"></script>
  </body>
</html>
